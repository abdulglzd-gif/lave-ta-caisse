<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Lave ta caisse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#000;--card:#0f1416;--line:#1d2a2d;--cy:#5ce1e6;--tx:#fff;--mut:#9fb0b3;--ok:#4ade80;--warn:#fbbf24;--ko:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:900px;margin:auto}
h1{font-family:Impact,"Arial Narrow Bold",sans-serif;letter-spacing:1px;margin:8px 0;font-size:28px}
h1 span{color:var(--cy)}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:10px 12px}
button{cursor:pointer;background:var(--cy);color:#000;font-weight:700;border:0}
button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line);font-weight:400}
#login{max-width:340px;margin:60px auto;display:grid;gap:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.top b{font-size:18px}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px;margin:10px 0;font-size:14px}
.grid div span{color:var(--mut)}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ph img{width:110px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#lb img{max-width:100%;max-height:100%;border-radius:10px}
.msg{color:var(--ko);min-height:1.2em;font-size:14px}
a{color:var(--cy)}
</style>
</head>
<body>
<div id="login">
  <h1>LAVE TA <span>CAISSE</span></h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <button id="go">Connexion</button>
  <div class="msg" id="lm"></div>
</div>

<div id="app" hidden>
  <div class="bar">
    <h1>LAVE TA <span>CAISSE</span> · Admin</h1>
    <div><button class="ghost" id="rf">Actualiser</button> <button class="ghost" id="out">Déconnexion</button></div>
  </div>
  <div class="bar">
    <input id="q" placeholder="Rechercher (nom, tél, véhicule…)" style="flex:1;min-width:200px">
    <select id="f"><option value="">Tous les statuts</option><option>nouveau</option><option>confirmé</option><option>terminé</option><option>annulé</option></select>
  </div>
  <div class="msg" id="am"></div>
  <div id="list"></div>
</div>
<div id="lb"><img alt=""></div>

<script>
var SB="https://mamprtsdnqyddszmtxny.supabase.co",KEY="sb_publishable_VKgw9KuUNnZvHQaClL5bQA_rxVrgj8i",BUCKET="photos";
var STATUTS=["nouveau","confirmé","terminé","annulé"];
var sb=supabase.createClient(SB,KEY),rows=[];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

async function show(){
  var s=(await sb.auth.getSession()).data.session;
  $("login").hidden=!!s;$("app").hidden=!s;
  if(s)load();
}
$("go").onclick=async function(){
  $("lm").textContent="";
  var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(r.error)$("lm").textContent="Identifiants incorrects.";else show();
};
$("pw").onkeydown=function(e){if(e.key==="Enter")$("go").click()};
$("out").onclick=async function(){await sb.auth.signOut();show()};
$("rf").onclick=load;$("q").oninput=render;$("f").onchange=render;

async function load(){
  $("am").textContent="Chargement…";
  var r=await sb.from("reservations").select("*").order("created_at",{ascending:false});
  if(r.error){$("am").textContent="Erreur : "+r.error.message+" (vérifie les policies RLS)";return}
  $("am").textContent="";rows=r.data||[];
  var paths=[];rows.forEach(function(x){(x.photos||[]).forEach(function(p){paths.push(p)})});
  window.urls={};
  if(paths.length){
    var s=await sb.storage.from(BUCKET).createSignedUrls(paths,3600);
    (s.data||[]).forEach(function(o){if(o.signedUrl)window.urls[o.path]=o.signedUrl});
  }
  render();
}

function render(){
  var q=$("q").value.toLowerCase(),f=$("f").value;
  var out=rows.filter(function(x){
    if(f&&x.statut!==f)return false;
    return !q||[x.nom,x.telephone,x.vehicule,x.lieu,x.creneau,x.formule].join(" ").toLowerCase().indexOf(q)>-1;
  }).map(function(x){
    var ph=(x.photos||[]).map(function(p){var u=window.urls[p];return u?'<img src="'+esc(u)+'" loading="lazy" alt="Photo">':""}).join("");
    var opts=STATUTS.map(function(s){return'<option'+(s===x.statut?" selected":"")+'>'+s+'</option>'}).join("");
    return'<div class="card"><div class="top"><b>'+esc(x.nom)+' · '+esc(x.creneau)+'</b>'
      +'<select data-id="'+esc(x.id)+'">'+opts+'</select></div>'
      +'<div class="grid">'
      +'<div><span>Téléphone</span><br><a href="tel:'+esc(x.telephone)+'">'+esc(x.telephone)+'</a></div>'
      +'<div><span>Véhicule</span><br>'+esc(x.vehicule)+' ('+esc(x.taille)+')</div>'
      +'<div><span>Formule</span><br>'+esc(x.formule)+' · '+esc(x.etat)+' · <b>'+esc(x.prix)+' €</b></div>'
      +'<div><span>Lieu</span><br>'+esc(x.lieu)+'</div>'
      +(x.remarque?'<div><span>Remarque</span><br>'+esc(x.remarque)+'</div>':"")
      +'</div>'+(ph?'<div class="ph">'+ph+'</div>':'<div class="mut">Aucune photo</div>')
      +'<div class="mut" style="font-size:12px;margin-top:8px">Reçue le '+new Date(x.created_at).toLocaleString("fr-FR")+'</div></div>';
  });
  $("list").innerHTML=out.join("")||'<p class="mut">Aucune réservation.</p>';
}

$("list").onchange=async function(e){
  var t=e.target;if(!t.dataset.id)return;
  var r=await sb.from("reservations").update({statut:t.value}).eq("id",t.dataset.id);
  if(r.error){$("am").textContent="Erreur : "+r.error.message;load()}
  else rows.forEach(function(x){if(x.id===t.dataset.id)x.statut=t.value});
};
$("list").onclick=function(e){
  if(e.target.tagName==="IMG"){$("lb").firstElementChild.src=e.target.src;$("lb").style.display="flex"}
};
$("lb").onclick=function(){$("lb").style.display="none"};
show();
</script>
</body>
</html>
